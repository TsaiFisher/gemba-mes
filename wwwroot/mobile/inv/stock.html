<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="stock.page_title">庫存查詢</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/inv-stock.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/inv/list.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-search me-2"></i><span data-i18n="stock.title">庫存查詢</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">

    <!-- 查詢輸入 -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-3">
            <!-- 查詢模式切換 -->
            <div class="btn-group w-100 mb-3" role="group">
                <input type="radio" class="btn-check" name="queryMode" id="modeProduct" value="product" checked>
                <label class="btn btn-outline-success btn-sm" for="modeProduct">
                    <i class="bi bi-box me-1"></i><span data-i18n="stock.mode_product">依品號查</span>
                </label>
                <input type="radio" class="btn-check" name="queryMode" id="modeLocation" value="location">
                <label class="btn btn-outline-success btn-sm" for="modeLocation">
                    <i class="bi bi-geo-alt me-1"></i><span data-i18n="stock.mode_location">依儲位查</span>
                </label>
            </div>

            <label class="form-label small fw-semibold" id="inputLabel" data-i18n="stock.label_product">品號（掃描條碼或手動輸入）</label>
            <div class="input-group mb-2">
                <input type="text" id="productInput" class="form-control btn-mobile"
                       placeholder="品號 / 條碼" data-i18n-placeholder="stock.ph_product" autocomplete="off">
                <button class="btn btn-outline-secondary" data-action="openScanner" data-i18n-title="common.scan" title="掃描">
                    <i class="bi bi-upc-scan"></i><span class="ms-1" data-i18n="common.scan">掃描</span>
                </button>
                <button class="btn btn-success" data-action="queryStock" data-i18n-title="common.search" title="搜尋">
                    <i class="bi bi-search"></i><span class="ms-1" data-i18n="common.search">搜尋</span>
                </button>
            </div>

            <!-- 掃描區（點擊開啟） -->
            <div class="scan-zone" id="scanZone" data-action="openScanner">
                <i class="bi bi-upc-scan fs-2 text-muted"></i>
                <span class="small text-muted" data-i18n="stock.scan_tap">點擊掃描</span>
            </div>
        </div>
    </div>

    <!-- 查詢結果 -->
    <div class="u-display-none" id="resultSection">

        <!-- 標題列（依模式切換） -->
        <div class="card shadow-sm mb-3">
            <div class="card-body py-2 px-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold" id="prodCode">—</div>
                        <div class="small text-muted" id="prodName">—</div>
                    </div>
                    <div class="text-end" id="totalSection">
                        <div class="text-muted small" data-i18n="stock.total">總庫存</div>
                        <div class="qty-text text-success" id="totalQty">—</div>
                        <div class="small text-muted" id="totalUom">—</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 明細列（品號模式：各儲位；儲位模式：各品項） -->
        <div class="card shadow-sm mb-3">
            <div class="card-header bg-white py-2">
                <span class="fw-semibold small" id="detailHeader">
                    <i class="bi bi-geo-alt me-1"></i><span data-i18n="stock.header_by_loc">各儲位庫存</span>
                </span>
            </div>
            <div class="card-body py-2 px-3" id="locationRows"></div>
        </div>

    </div>

    <!-- 空白提示 -->
    <div id="emptyState" class="text-center text-muted py-5 u-display-none">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        <span data-i18n="stock.empty">找不到庫存記錄</span>
    </div>

</div>

<!-- 掃描 Modal -->
<div class="modal fade" id="scannerModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" data-i18n="stock.scan_title">掃描品號條碼</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0"><div id="scanModalReader"></div></div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/libs/html5-qrcode.min.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
    <script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/js/scanner.js"></script>
<script src="/mobile/inv/stock.page.js"></script>
</body>
</html>
