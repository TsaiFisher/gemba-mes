<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="pick.page_title">出庫下架</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/inv-pick.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/inv/list.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-box-arrow-up me-2"></i><span data-i18n="pick.title">出庫下架</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">

    <!-- 步驟一：選擇待出庫單據 -->
    <div id="stepDoc" class="card shadow-sm mb-3 u-border-radius-12px">
        <div class="card-header bg-white py-2">
            <span class="step-num bg-danger text-white me-2">1</span>
            <span class="fw-semibold small" data-i18n="pick.step1">選擇待出庫單據</span>
        </div>
        <div class="card-body py-2">
            <div class="input-group mb-2">
                <input type="text" id="docSearch" class="form-control btn-mobile"
                       placeholder="搜尋單號或品號" data-i18n-placeholder="pick.search_ph" data-action-input="searchDocs">
                <button class="btn btn-outline-secondary" data-action="loadPending" data-i18n-title="common.refresh" title="重新整理">
                    <i class="bi bi-arrow-repeat"></i><span class="ms-1" data-i18n="common.refresh">重新整理</span>
                </button>
            </div>
            <div id="pendingList">
                <div class="text-center text-muted py-3">
                    <div class="spinner-border spinner-border-sm me-1"></div><span data-i18n="common.loading">載入中…</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 步驟二：選擇來源儲位 + 下架數量 -->
    <div id="stepPick" class="card shadow-sm mb-3 u-border-radius-12px u-display-none">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
            <div>
                <span class="step-num bg-danger text-white me-2">2</span>
                <span class="fw-semibold small" data-i18n="pick.step2">確認下架</span>
            </div>
            <button class="btn btn-sm btn-outline-secondary" data-action="resetStep">
                <i class="bi bi-arrow-left me-1"></i><span data-i18n="pick.reselect">重選</span>
            </button>
        </div>
        <div class="card-body py-3">
            <!-- 品項 -->
            <div class="bg-light rounded p-2 mb-3 small">
                <div class="d-flex justify-content-between">
                    <span class="text-muted" data-i18n="pick.doc_no">單號</span><span id="selDocNo" class="fw-semibold">—</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted" data-i18n="pick.product">品號</span><span id="selProduct" class="fw-semibold">—</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted" data-i18n="pick.need">需下架</span><span id="selNeed" class="text-danger fw-bold">—</span>
                </div>
            </div>

            <!-- 各儲位庫存 -->
            <div class="mb-3">
                <div class="fw-semibold small mb-1" data-i18n="pick.avail_stock">各儲位庫存</div>
                <div id="stockRows" class="small text-muted"><span data-i18n="pick.querying">查詢中…</span></div>
            </div>

            <!-- 來源儲位 -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" data-i18n="pick.src_loc">來源儲位</label>
                <div class="input-group">
                    <input type="text" id="locationCode" class="form-control btn-mobile"
                           placeholder="掃描或輸入儲位代碼" data-i18n-placeholder="pick.loc_ph" data-action-change="onLocationInput">
                    <button class="btn btn-outline-secondary" data-action="openLocScanner" data-i18n-title="common.scan" title="掃描">
                        <i class="bi bi-upc-scan"></i><span class="ms-1" data-i18n="common.scan">掃描</span>
                    </button>
                </div>
                <div id="pickLotInfo" class="small text-success mt-1"></div>
            </div>

            <!-- 下架數量 -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" data-i18n="pick.qty_label">下架數量</label>
                <input type="number" id="pickQty" class="form-control qty-input btn-mobile"
                       min="0" step="any" inputmode="decimal">
                <div class="text-muted small mt-1">UOM：<span id="selUom">—</span></div>
            </div>

            <div class="d-grid">
                <button class="btn btn-danger btn-lg action-btn" id="btnPick" data-action="submitPick">
                    <i class="bi bi-check-circle me-2"></i><span data-i18n="pick.submit">確認下架</span>
                </button>
            </div>
        </div>
    </div>

</div>

<!-- 掃描 Modal -->
<div class="modal fade" id="scannerModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" data-i18n="pick.scan_title">掃描儲位條碼</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0"><div id="reader"></div></div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/libs/html5-qrcode.min.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/js/scanner.js"></script>
<script src="/mobile/js/offline-queue.js"></script>
<script src="/mobile/inv/pick.page.js"></script>
</body>
</html>
