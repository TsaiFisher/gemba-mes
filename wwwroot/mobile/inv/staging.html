<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="stg.title">備料作業</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/inv-material.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/inv/list.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-diagram-3 me-2"></i><span data-i18n="stg.title">備料作業</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">
    <div id="listCard" class="card shadow-sm mb-3">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
            <span class="fw-semibold small" data-i18n="stg.pending">待處理備料單</span>
            <button class="btn btn-sm btn-outline-secondary" data-action="loadOrders" data-i18n-title="common.refresh" title="重新整理"><i class="bi bi-arrow-repeat"></i><span class="ms-1" data-i18n="common.refresh">重新整理</span></button>
        </div>
        <div class="card-body py-2" id="orderList">
            <div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-1"></div><span data-i18n="common.loading">載入中…</span></div>
        </div>
    </div>
    <div id="detailCard" class="card shadow-sm mb-3 u-display-none">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
            <span class="fw-semibold small" id="detailTitle">—</span>
            <button class="btn btn-sm btn-outline-secondary" data-action="backToList" data-i18n-title="common.close" title="關閉"><i class="bi bi-x-lg"></i><span class="ms-1" data-i18n="common.close">關閉</span></button>
        </div>
        <div class="card-body py-2">
            <div class="small text-muted mb-2" id="detailMeta"></div>
            <div id="lineRows"></div>
            <div class="d-grid mt-3 gap-2">
                <button class="btn btn-outline-primary btn-lg u-display-none" id="btnConfirm" data-action="confirmOrder">
                    <i class="bi bi-lock me-2"></i><span data-i18n="stg.confirm">確認並鎖定庫存</span>
                </button>
                <button class="btn btn-primary btn-lg u-display-none" id="btnStage" data-action="stageOrder">
                    <i class="bi bi-arrow-left-right me-2"></i><span data-i18n="stg.stage">揀料移入備料倉</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/js/offline-queue.js"></script>
<script src="/mobile/js/material-common.js"></script>
<script src="/mobile/inv/staging.page.js"></script>
</body>
</html>
