<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="putaway.page_title">入庫上架</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/inv-putaway.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/inv/list.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-box-arrow-in-down me-2"></i><span data-i18n="putaway.title">入庫上架</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">

    <!-- 步驟一：選擇待入庫單據 -->
    <div id="stepDoc" class="card step-card shadow-sm mb-3">
        <div class="card-header bg-white py-2">
            <span class="step-num bg-primary text-white me-2">1</span>
            <span class="fw-semibold small" data-i18n="putaway.step1">選擇待入庫單據</span>
        </div>
        <div class="card-body py-2">
            <div class="input-group mb-2">
                <input type="text" id="docSearch" class="form-control btn-mobile" placeholder="搜尋單號或品號" data-i18n-placeholder="putaway.search_ph" data-action-input="searchDocs">
                <button class="btn btn-outline-secondary" data-action="loadPending" data-i18n-title="common.refresh" title="重新整理">
                    <i class="bi bi-arrow-repeat"></i><span class="ms-1" data-i18n="common.refresh">重新整理</span>
                </button>
            </div>
            <div id="pendingList">
                <div class="text-center text-muted py-3">
                    <div class="spinner-border spinner-border-sm me-1"></div><span data-i18n="common.loading">載入中…</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 步驟二：確認品項 + 選擇目的儲位 + 數量 -->
    <div id="stepPutAway" class="card step-card shadow-sm mb-3 u-display-none">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
            <div>
                <span class="step-num bg-success text-white me-2">2</span>
                <span class="fw-semibold small" data-i18n="putaway.step2">確認上架</span>
            </div>
            <button class="btn btn-sm btn-outline-secondary" data-action="resetStep">
                <i class="bi bi-arrow-left me-1"></i><span data-i18n="putaway.reselect">重選</span>
            </button>
        </div>
        <div class="card-body py-3">
            <!-- 品項資訊 -->
            <div class="bg-light rounded p-2 mb-3 small">
                <div class="d-flex justify-content-between">
                    <span class="text-muted" data-i18n="putaway.doc_no">單號</span><span id="selDocNo" class="fw-semibold">—</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted" data-i18n="putaway.product">品號</span><span id="selProduct" class="fw-semibold">—</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted" data-i18n="putaway.pending_qty">待上架</span><span id="selPending" class="text-primary fw-bold">—</span>
                </div>
            </div>

            <!-- 目的儲位 -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" data-i18n="putaway.dest_loc">目的儲位</label>
                <div class="input-group">
                    <input type="text" id="locationCode" class="form-control btn-mobile"
                           placeholder="掃描或輸入儲位代碼" data-i18n-placeholder="putaway.loc_ph">
                    <button class="btn btn-outline-secondary" data-action="openLocScanner" data-i18n-title="common.scan" title="掃描">
                        <i class="bi bi-upc-scan"></i><span class="ms-1" data-i18n="common.scan">掃描</span>
                    </button>
                </div>
            </div>

            <!-- 裝入箱號（選填，container-tracking.md §9.4）：掃空箱，這次上架的量就放進這一箱、系統產生新批號 -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" data-i18n="putaway.box_label">裝入箱號（選填）</label>
                <input type="text" id="boxId" class="form-control btn-mobile font-monospace" autocomplete="off"
                       placeholder="掃空箱" data-i18n-placeholder="putaway.box_ph">
            </div>

            <!-- 上架數量 -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" data-i18n="putaway.qty_label">上架數量</label>
                <input type="number" id="putQty" class="form-control qty-input btn-mobile"
                       min="0" step="any" inputmode="decimal">
                <div class="text-muted small mt-1">UOM：<span id="selUom">—</span></div>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary btn-lg action-btn" id="btnPutAway" data-action="submitPutAway">
                    <i class="bi bi-check-circle me-2"></i><span data-i18n="putaway.submit">確認上架</span>
                </button>
            </div>
        </div>
    </div>

</div>

<!-- 儲位掃描 Modal -->
<div class="modal fade" id="scannerModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" data-i18n="putaway.scan_title">掃描儲位條碼</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0"><div id="reader"></div></div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/libs/html5-qrcode.min.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/js/scanner.js"></script>
<script src="/mobile/js/offline-queue.js"></script>
<script src="/mobile/inv/putaway.page.js"></script>
</body>
</html>
