<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="mreq.title">領料／退料</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/inv-material.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/mfg/list.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="mreq.title">領料／退料</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">
    <div class="small text-muted mb-2" id="woInfo">—</div>
    <div class="btn-group w-100 mb-3" role="group">
        <input type="radio" class="btn-check" name="reqKind" id="kindReq" value="requisition" checked data-action-change="onReqKindChange">
        <label class="btn btn-outline-primary" for="kindReq" data-i18n="mreq.kind_req">領料申請</label>
        <input type="radio" class="btn-check" name="reqKind" id="kindRet" value="return" data-action-change="onReqKindChange">
        <label class="btn btn-outline-warning" for="kindRet" data-i18n="mreq.kind_ret">退料</label>
    </div>
    <div class="alert alert-light border py-2 small" id="kindHint"></div>
    <div id="matRows"><div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-1"></div><span data-i18n="common.loading">載入中…</span></div></div>
    <div class="mb-2">
        <input type="text" id="reqRemarks" class="form-control" maxlength="200" placeholder="備註（選填）" data-i18n-placeholder="mreq.remarks_ph">
    </div>
    <div class="d-grid">
        <button class="btn btn-primary btn-lg" id="btnReq" data-action="submitRequest">
            <i class="bi bi-send me-2"></i><span id="btnReqLabel" data-i18n="mreq.submit_req">送出領料申請</span>
        </button>
    </div>
</div>

<div id="toast-container"></div>
<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/js/offline-queue.js"></script>
<script src="/mobile/js/material-common.js"></script>
<script src="/mobile/mfg/requisition.page.js"></script>
</body>
</html>
