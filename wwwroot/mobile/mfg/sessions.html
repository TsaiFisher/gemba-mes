<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="session.page_title">投產報工 — 開工作業</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/mfg-sessions.css">
</head>
<body class="bg-light">

<!-- 頂部導覽列 -->
<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/mfg/list.html" class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1" data-i18n="session.title">開工作業</span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle data-i18n-title="common.lang_switch" title="Language">EN</button>
            <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">

    <!-- 派工資訊卡 -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
            <span class="fw-bold small" data-i18n="session.info">派工資訊</span>
            <span id="dispatchStatus" class="badge bg-secondary">—</span>
        </div>
        <div class="card-body py-2 px-3" id="dispatchInfo">
            <div class="text-center text-muted py-3">
                <div class="spinner-border spinner-border-sm me-1"></div><span data-i18n="common.loading">載入中…</span>
            </div>
        </div>
    </div>

    <!-- 步驟一：備料 Setup -->
    <div class="card mb-3 shadow-sm step-panel" id="panelSetup">
        <div class="card-header bg-white py-2">
            <span class="step-number bg-warning text-dark me-2">1</span>
            <span class="fw-semibold small" data-i18n="session.setup_section">備料準備（Setup）</span>
        </div>
        <div class="card-body py-3">
            <!-- 備料＝把本派工用料移入備料倉待領用；模具沿用排程指定值，現場不再回報 -->
            <div id="stagingBlock" class="mb-3">
                <div id="stagingStatus" class="small text-muted" data-i18n="session.staging_loading">載入備料狀態中…</div>
                <button class="btn btn-outline-primary btn-mobile w-100 mt-2 d-none" id="btnCreateStaging"
                        data-action="doCreateStaging">
                    <i class="bi bi-file-earmark-plus me-2"></i><span data-i18n="session.create_staging">建立備料單</span>
                </button>
            </div>
            <div class="d-grid gap-2">
                <button class="btn btn-warning btn-lg action-btn" id="btnSetupStart" data-action="doSetupStart">
                    <i class="bi bi-play-fill me-2"></i><span data-i18n="session.setup_start">開始備料</span>
                </button>
                <button class="btn btn-success btn-lg action-btn d-none" id="btnSetupDone" data-action="doSetupDone">
                    <i class="bi bi-check-lg me-2"></i><span data-i18n="session.setup_done">備料完成</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 步驟二：開工 -->
    <div class="card mb-3 shadow-sm step-panel" id="panelSession">
        <div class="card-header bg-white py-2">
            <span class="step-number bg-primary text-white me-2">2</span>
            <span class="fw-semibold small" data-i18n="session.step2">開工 / 下工</span>
        </div>
        <div class="card-body py-3">
            <div class="mb-3">
                <label class="form-label small fw-semibold" data-i18n="session.machine_label">機台代碼（選填，覆寫派工預設）</label>
                <div class="input-group">
                    <input type="text" id="sessionMachine" class="form-control btn-mobile" data-i18n-placeholder="session.machine_ph" placeholder="掃描或手動輸入">
                    <button class="btn btn-outline-secondary" data-action="openMachineScanner" data-i18n-title="dispatch.scan_machine" title="掃描機台">
                        <i class="bi bi-upc-scan"></i><span class="ms-1" data-i18n="common.scan">掃描</span>
                    </button>
                </div>
            </div>
            <div class="text-center mb-3 d-none" id="timerArea">
                <div class="text-muted small mb-1" data-i18n="session.elapsed">已開工時間</div>
                <div class="timer text-success" id="timer">00:00:00</div>
            </div>
            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg action-btn" id="btnStart" data-action="doStart">
                    <i class="bi bi-play-circle me-2"></i><span data-i18n="session.start">開工</span>
                </button>
                <!-- 完工＝結束本次上工（報工可在報工頁多次進行，人仍在線上繼續生產） -->
                <button class="btn btn-outline-danger btn-lg action-btn d-none" id="btnStop" data-action="doStop">
                    <i class="bi bi-flag-fill me-2"></i><span data-i18n="session.complete">完工（結束本次上工）</span>
                </button>
                <button class="btn btn-success btn-lg action-btn d-none" id="btnGoReport" data-action="goReport">
                    <i class="bi bi-clipboard-check me-2"></i><span data-i18n="session.goto_report">報工</span>
                </button>
                <!-- 領料申請／退料：有「領料／退料申請」作業權限才顯示 -->
                <button class="btn btn-outline-secondary btn-lg action-btn d-none" id="btnRequisition" data-action="goRequisition">
                    <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="mreq.title">領料／退料</span>
                </button>
            </div>
        </div>
    </div>

</div>

<!-- 機台掃描 Modal -->
<div class="modal fade" id="scannerModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" data-i18n="machine.scan_ph">掃描機台 QR Code</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div id="reader"></div>
            </div>
        </div>
    </div>
</div>

<!-- Toast 容器 -->
<div id="toast-container"></div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/libs/html5-qrcode.min.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
    <script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/js/scanner.js"></script>
<script src="/mobile/js/offline-queue.js"></script>
<script src="/mobile/mfg/sessions.page.js"></script>
</body>
</html>
