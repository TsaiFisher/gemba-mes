<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="ipqc.page_title">製程檢驗 IPQC</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/mfg-ipqc.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-warning mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/mfg/list.html"
            class="btn btn-link text-dark p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1 text-dark">
        <i class="bi bi-clipboard2-pulse me-2"></i>
        <span data-i18n="ipqc.title">製程檢驗 IPQC</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-dark btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-dark btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-dark btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">

    <div class="std-banner p-2 mb-3 small" data-i18n-html="ipqc.banner">
        <strong>MIL-STD-1916</strong>：Ac=0，製程中任何不良品即觸發派工暫停。
        點擊生產中派工開始 IPQC 量測。
    </div>

    <!-- 派工搜尋 + 列表 -->
    <div class="input-group mb-2">
        <input type="text" id="dispatchSearch" class="form-control btn-mobile"
               data-i18n-placeholder="dispatch.search_ph" placeholder="搜尋工單或機台" data-action-input="searchDispatches">
        <button class="btn btn-outline-secondary" data-action="loadDispatches" data-i18n-title="common.refresh" title="重新整理">
            <i class="bi bi-arrow-repeat"></i><span class="ms-1" data-i18n="common.refresh">重新整理</span>
        </button>
    </div>
    <div id="dispatchList">
        <div class="text-center text-muted py-3">
            <div class="spinner-border spinner-border-sm me-1"></div><span data-i18n="common.loading">載入中…</span>
        </div>
    </div>

</div>

<div id="toast-container"></div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
    <script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/mfg/ipqc.page.js"></script>
</body>
</html>
