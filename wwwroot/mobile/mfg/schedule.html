<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="sched.page_title">生產排程 — 派工預覽</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/mfg-schedule.css">
</head>
<body class="bg-light">

<!-- 頂部導覽列 -->
<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/mfg/list.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-bar-chart-steps me-2"></i><span data-i18n="sched.title">生產排程</span>
    </span>
    <button class="btn btn-outline-light btn-sm me-1" data-action="loadSchedule" data-i18n-title="common.refresh" title="重新整理">
        <i class="bi bi-arrow-clockwise"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.refresh">重新整理</span>
    </button>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<!-- 相關作業捷徑 -->
<div class="bg-white border-bottom px-3 pt-3 pb-2">
    <div class="d-flex gap-2">
        <a href="/mobile/mfg/schedule-query.html" class="btn btn-outline-primary btn-sm flex-fill text-start">
            <i class="bi bi-search me-1"></i><span data-i18n="sched.op_query">排程查詢</span>
        </a>
        <a href="/mobile/mfg/preparation.html" class="btn btn-outline-success btn-sm flex-fill text-start">
            <i class="bi bi-list-check me-1"></i><span data-i18n="sched.op_prep">生產準備看板</span>
        </a>
    </div>
</div>

<!-- 篩選列 -->
<div class="bg-white border-bottom p-3">
    <div class="row g-2 align-items-end">
        <div class="col">
            <label class="form-label mb-1 small fw-semibold" data-i18n="sched.date_to">顯示至</label>
            <input type="date" id="inputDateTo" class="form-control form-control-sm">
        </div>
        <div class="col-auto">
            <div class="form-check mb-0 mt-3">
                <input class="form-check-input" type="checkbox" id="chkLateOnly">
                <label class="form-check-label small" for="chkLateOnly" data-i18n="sched.late_only">僅延遲</label>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2 mt-2 flex-wrap small">
        <span><span class="badge u-background-198754">&#9632;</span> <span data-i18n="sched.legend_inprogress">生產中</span></span>
        <span><span class="badge u-background-dc3545">&#9632;</span> <span data-i18n="sched.legend_late">預測延遲</span></span>
        <span><span class="badge u-background-fd7e14">&#9632;</span> <span data-i18n="sched.legend_matrisk">待料風險</span></span>
        <span><span class="badge u-background-6c757d">&#9632;</span> <span data-i18n="sched.legend_scheduled">已排</span></span>
    </div>
</div>

<!-- 內容區 -->
<div class="container-fluid py-3 px-3">
    <div id="loadingState" class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div><span data-i18n="common.loading">載入中…</span>
    </div>
    <div id="emptyState" class="text-center text-muted py-5 d-none">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i><span data-i18n="sched.empty">無已排程派工</span>
    </div>
    <div id="scheduleContent"></div>
    <div id="lastRefreshText" class="text-center text-muted small mt-3"></div>
</div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/mfg/schedule.page.js"></script>
</body>
</html>
