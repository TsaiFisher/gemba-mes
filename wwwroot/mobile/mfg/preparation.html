<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="prep.page_title">生產準備看板</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
    <link rel="stylesheet" href="/mobile/css/mfg-preparation.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/mfg/schedule.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回排程">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-list-check me-2"></i><span data-i18n="prep.title">生產準備看板</span>
    </span>
    <button class="btn btn-outline-light btn-sm me-1" data-action="loadPrep" data-i18n-title="common.refresh" title="重新整理">
        <i class="bi bi-arrow-clockwise"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.refresh">重新整理</span>
    </button>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="bg-white border-bottom p-3">
    <!-- 今日 / 明日 / 自訂 Tab -->
    <div class="btn-group w-100 mb-2" role="group">
        <button type="button" class="btn btn-outline-primary btn-sm" id="btnToday"    data-action="selectDate" data-when="today"><span data-i18n="prep.today">今日</span></button>
        <button type="button" class="btn btn-primary btn-sm"         id="btnTomorrow" data-action="selectDate" data-when="tomorrow"><span data-i18n="prep.tomorrow">明日</span></button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCustom" data-action="selectDate" data-when="custom"><span data-i18n="prep.custom">自訂</span></button>
    </div>
    <div id="customDateRow" class="mb-2 u-display-none">
        <input type="date" id="inputCustomDate" class="form-control form-control-sm">
    </div>
    <!-- 隱藏欄位儲存目前選取日期（supply to loadPrep） -->
    <input type="hidden" id="inputPrepDate" value="">
    <div class="d-flex gap-2 flex-wrap small">
        <span><span class="badge u-background-6f42c1">&#9632;</span> <span data-i18n="prep.legend_tooling">模具衝突</span></span>
        <span><span class="badge u-background-fd7e14">&#9632;</span> <span data-i18n="sched.legend_matrisk">待料風險</span></span>
        <span><span class="badge u-background-dc3545">&#9632;</span> <span data-i18n="sched.legend_late">預測延遲</span></span>
    </div>
</div>

<div class="container-fluid py-3 px-3">
    <div id="loadingState" class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div><span data-i18n="common.loading">載入中…</span>
    </div>
    <div id="emptyState" class="text-center text-muted py-5 d-none">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i><span data-i18n="prep.empty">無準備資料</span>
    </div>
    <div id="prepContent"></div>
    <div id="lastRefreshText" class="text-center text-muted small mt-3"></div>
</div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/mfg/preparation.page.js"></script>
</body>
</html>
