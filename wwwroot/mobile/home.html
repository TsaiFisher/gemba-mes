<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="home.page_title">SmartFactory MES — 首頁</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
</head>
<body class="bg-light">
    <!-- 頂部導覽列 -->
    <nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-factory me-2"></i>SmartFactory MES
        </span>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white small" id="userName"></span>
            <button class="btn btn-outline-light btn-sm u-display-none" id="btnPush" data-action="togglePush" data-i18n-title="home.push_title" title="推播通知">
                <i class="bi bi-bell" id="pushIcon"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="home.push_title">推播通知</span>
            </button>
            <button class="btn btn-outline-light btn-sm u-display-none" id="btnPushTest" data-action="testPush" data-i18n-title="home.push_test" title="測試推播">
                <i class="bi bi-bell-fill text-warning"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="home.push_test">測試推播</span>
            </button>
            <!-- 語言切換 -->
            <button class="btn btn-outline-light btn-sm" data-action="toggleLang"
                    data-lang-toggle data-i18n-title="common.lang_switch" title="Switch Language / 切換語言">EN</button>
            <button class="btn btn-outline-light btn-sm" data-action="logout"
                    data-i18n-title="common.logout" title="登出">
                <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
            </button>
        </div>
    </nav>

    <!-- 廠別列：手機端在此之前完全看不到自己在哪個廠，而 ActivePlantId 是桌機／手機
         共用的同一個值——現場人員的廠別原本取決於他上次在電腦上切到哪。 -->
    <div class="bg-white border-bottom px-3 py-2 d-flex align-items-center gap-2">
        <i class="bi bi-building text-muted"></i>
        <span class="small text-muted" data-i18n="home.plant">廠別</span>
        <span class="small fw-semibold" id="plantName"></span>
        <button class="btn btn-sm btn-outline-secondary ms-auto py-0" id="btnSwitchPlant"
                data-action="openPlantSwitch" data-i18n="home.plant_switch">切換</button>
    </div>

    <!-- 角色列（2026-11-11）：原本只有電腦能切角色；作用中角色被移除時手機沒有出路。 -->
    <div class="bg-white border-bottom px-3 py-2 d-flex align-items-center gap-2">
        <i class="bi bi-person-badge text-muted"></i>
        <span class="small text-muted" data-i18n="home.role">角色</span>
        <span class="small fw-semibold" id="roleName"></span>
        <button class="btn btn-sm btn-outline-secondary ms-auto py-0" id="btnSwitchRole"
                data-action="openRoleSwitch" data-i18n="home.plant_switch">切換</button>
    </div>

    <!-- 角色切換面板 -->
    <div class="offcanvas offcanvas-bottom u-max-height-70vh" id="rolePanel">
        <div class="offcanvas-header bg-light py-2 border-bottom">
            <h6 class="offcanvas-title fw-bold">
                <i class="bi bi-person-badge me-1"></i>
                <span data-i18n="home.role_switch_title">切換角色</span>
            </h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="small text-muted px-3 py-2 border-bottom" data-i18n="home.role_hint">切換後若新角色不含目前的廠別，會改到該角色的預設廠別。</div>
            <div id="roleList" class="u-overflow-y-auto u-max-height-50vh">
                <div class="text-muted text-center small py-3" data-i18n="common.loading">載入中…</div>
            </div>
        </div>
    </div>

    <!-- 廠別切換面板。按鈕**不隱藏**（即使只有一個廠）：切不了的人更需要知道
         「為什麼只有這一個」，而那正是這個功能要解決的透明度問題。 -->
    <div class="offcanvas offcanvas-bottom u-max-height-70vh" id="plantPanel">
        <div class="offcanvas-header bg-light py-2 border-bottom">
            <h6 class="offcanvas-title fw-bold">
                <i class="bi bi-building me-1"></i>
                <span data-i18n="home.plant_switch_title">切換廠別</span>
            </h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div id="plantHint" class="small text-muted px-3 py-2 border-bottom"></div>
            <div id="plantList" class="u-overflow-y-auto u-max-height-50vh">
                <div class="text-muted text-center small py-3" data-i18n="common.loading">載入中…</div>
            </div>
        </div>
    </div>

    <!-- 功能模組格狀選單 -->
    <div class="container-fluid py-4 px-3">

        <!-- 待我簽核入口。
             ⚠️ 刻意**不**放進 moduleGrid：格狀選單由 MobileModules／MobileModuleActions
             按角色授權，而桌機的簽核只有 [Authorize]、看得到什麼完全由「這張單有沒有指到我」決定。
             掛上手機模組閘門會做出「桌機簽得了、手機看不到」，而那個 403 的症狀是清單空白，
             與「真的沒有待簽核」分不出來。所以這裡是固定入口，與桌機同一把鑰匙。 -->
        <a href="/mobile/approval/list.html"
           class="card shadow-sm text-decoration-none text-body mb-3 d-block">
            <div class="card-body py-3 d-flex align-items-center">
                <i class="bi bi-pen fs-4 text-primary me-3"></i>
                <span class="flex-grow-1 fw-semibold" data-i18n="home.approval">待我簽核</span>
                <span id="approvalCount" class="badge bg-danger rounded-pill me-2 d-none">0</span>
                <i class="bi bi-chevron-right text-muted"></i>
            </div>
        </a>

        <p class="text-muted small mb-3" data-i18n="home.title">請選擇作業功能</p>
        <div class="row g-3" id="moduleGrid">
            <!-- 由 JS 動態填入 -->
        </div>
        <div id="emptyState" class="text-center text-muted py-5 d-none">
            <i class="bi bi-lock fs-1 d-block mb-2"></i>
            <span data-i18n="home.no_perm">目前帳號尚未設定手機模組權限</span><br>
            <small data-i18n="home.no_perm_hint">請聯繫系統管理員</small>
        </div>
    </div>

    <!-- 離線佇列浮動按鈕 -->
    <div id="offlineBtn" class="position-fixed bottom-0 start-0 m-3 d-none u-z-index-1050">
        <button class="btn btn-warning shadow u-border-radius-50px u-font-size-p85rem u-padding-p4rem-p9rem" data-bs-toggle="offcanvas" data-bs-target="#offlinePanel"
               >
            <i class="bi bi-cloud-upload me-1"></i>
            <span id="offlineBtnTxt"><span id="offlineBtnCount">0</span> <span data-i18n="home.offline_btn">筆待同步</span></span>
        </button>
    </div>

    <!-- 離線狀態面板（offcanvas） -->
    <div class="offcanvas offcanvas-bottom u-max-height-70vh" id="offlinePanel">
        <div class="offcanvas-header bg-warning py-2">
            <h6 class="offcanvas-title fw-bold">
                <i class="bi bi-cloud-upload me-1"></i>
                <span data-i18n="home.offline_title">待送出（斷線時暫存）</span>
            </h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="d-flex justify-content-end gap-2 px-3 py-2 border-bottom bg-light">
                <button class="btn btn-sm btn-outline-success" data-action="syncNow">
                    <i class="bi bi-arrow-repeat me-1"></i><span data-i18n="home.sync_now">立即同步</span>
                </button>
                <button class="btn btn-sm btn-outline-warning" data-action="retryAllFailed">
                    <i class="bi bi-arrow-clockwise me-1"></i><span data-i18n="home.retry_failed">重試失敗項</span>
                </button>
                <button class="btn btn-sm btn-outline-secondary" data-action="clearSent">
                    <i class="bi bi-trash me-1"></i><span data-i18n="home.clear_sent">清除已送出</span>
                </button>
            </div>
            <div id="queueList" class="px-3 py-2 u-overflow-y-auto u-max-height-50vh">
                <div class="text-muted text-center small py-3" data-i18n="common.loading">載入中…</div>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div id="toast-container"></div>

    <script src="/mobile/js/telemetry.js"></script>
    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
    <script src="/mobile/js/i18n.js"></script>
    <script src="/mobile/js/i18n.modules.js"></script>
    <script src="/mobile/js/api.js"></script>
    <script src="/mobile/js/auth.js"></script>
    <script src="/mobile/js/offline-queue.js"></script>
    <script src="/mobile/home.page.js"></script>
</body>
</html>
