<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/mobile/manifest.json">
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png">
    <title data-i18n="approval.page_title">待我簽核</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mobile-navbar px-3">
    <button type="button" data-action="historyBack" data-fallback="/mobile/home.html"
            class="btn btn-link text-white p-0 me-2" data-i18n-title="common.back_prev" title="返回">
        <i class="bi bi-arrow-left fs-5"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.back_prev">返回</span>
    </button>
    <span class="navbar-brand fw-bold mb-0 h1 flex-grow-1">
        <i class="bi bi-pen me-2"></i><span data-i18n="approval.title">待我簽核</span>
    </span>
    <a href="/mobile/home.html" class="btn btn-outline-light btn-sm me-1" data-i18n-title="common.back" title="回首頁"><i class="bi bi-house-door"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="nav.home">首頁</span></a>
    <button class="btn btn-outline-light btn-sm me-1" data-action="toggleLang" data-lang-toggle title="Language">EN</button>
    <button class="btn btn-outline-light btn-sm" data-action="logout" data-i18n-title="common.logout" title="登出">
        <i class="bi bi-box-arrow-right"></i><span class="d-block lh-1 u-font-size-p65rem" data-i18n="common.logout">登出</span>
    </button>
</nav>

<div class="container-fluid py-3 px-3">

    <div id="loading" class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        <span data-i18n="common.loading">載入中…</span>
    </div>

    <div id="emptyState" class="text-center text-muted py-5 d-none">
        <i class="bi bi-check2-circle fs-1 d-block mb-2"></i>
        <span data-i18n="approval.empty">目前沒有待您簽核的單據</span>
    </div>

    <div id="errorState" class="alert alert-warning small d-none" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span id="errorText"></span>
    </div>

    <div id="list" class="d-grid gap-2"></div>
</div>

<!-- 簽核面板。
     ⚠️ 內容全部由 list.page.js 以 DOM API 建，這裡只留空殼——摘要裡的每個字串
        （單號、供應商名稱、備註、品號）都是使用者可控資料，innerHTML 少跳脫一處就是 XSS。 -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <div>
          <div class="small text-muted" data-i18n="approval.summary_title">簽核內容</div>
          <div class="fw-semibold text-break" id="reviewDocNo"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="reviewBody"></div>
      <div class="modal-footer d-block pt-2" id="reviewActions">
        <label for="reviewComment" class="form-label small text-muted mb-1"
               data-i18n="approval.comment">意見（選填）</label>
        <textarea id="reviewComment" class="form-control form-control-sm mb-2" rows="2"></textarea>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-danger flex-fill"
                  data-action="rejectApproval" data-i18n="approval.reject">駁回</button>
          <button type="button" class="btn btn-success flex-fill"
                  data-action="approveApproval" data-i18n="approval.approve">核准</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/mobile/js/telemetry.js"></script>
<script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/data-action.js"></script>
<script src="/mobile/js/nav.js"></script>
<script src="/mobile/js/i18n.js"></script>
<script src="/mobile/js/i18n.modules.js"></script>
<script src="/mobile/js/api.js"></script>
<script src="/mobile/js/auth.js"></script>
<script src="/mobile/approval/list.page.js"></script>
</body>
</html>
